<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Clã Michetti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .tab-btn.active { background-color: #7e22ce; color: white; }
    </style>
</head>
<body class="text-gray-200 bg-cover bg-center" style="background-image: linear-gradient(rgba(17, 24, 39, 0.4), rgba(17, 24, 39, 1)), url('imagens/Templo1.jpg');">

    <div id="loader" class="flex flex-col items-center justify-center text-center min-h-[120px] transition-opacity duration-500" style="display:none;">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
        <p class="mt-4 text-purple-200">Processando...</p>
    </div>

    <div id="admin-panel" class="hidden">
        <header class="bg-gray-900/80 backdrop-blur-sm sticky top-0 z-50 border-b border-purple-900/50">
            <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
                <a href="index.html" class="text-2xl font-bold font-cinzel text-purple-300">Clã Michetti</a>
                <button id="logout-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Sair</button>
            </nav>
        </header>

        <main class="container mx-auto p-8">
            <div class="mb-8 border-b border-gray-700">
                <nav class="flex space-x-4">
                    <button id="tab-products" class="tab-btn active px-4 py-2">Gerir Produtos</button>
                    <button id="tab-bruxos" class="tab-btn px-4 py-2">Gerir Bruxos</button>
                </nav>
            </div>

            <div id="products-content">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1">
                        <form id="product-form" class="bg-gray-800/50 p-6 rounded-lg space-y-4">
                            <h2 id="form-title" class="text-2xl font-bold mb-4 text-purple-300">Adicionar Produto</h2>
                            <input type="hidden" id="product-id">
                            <input type="hidden" id="current-image-url">
                            <div><label for="name" class="block mb-1">Nome</label><input type="text" id="name" required class="w-full bg-gray-700 p-2 rounded text-white"></div>
                            <div><label for="description" class="block mb-1">Descrição</label><textarea id="description" rows="4" required class="w-full bg-gray-700 p-2 rounded text-white"></textarea></div>
                            <div><label for="price" class="block mb-1">Preço</label><input type="number" step="0.01" id="price" required class="w-full bg-gray-700 p-2 rounded text-white"></div>
                            <div>
                                <label for="image-upload" class="block mb-1">Imagem do Produto</label>
                                <input type="file" id="image-upload" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200">
                                <p class="text-xs text-gray-500 mt-1">Selecione uma imagem para fazer upload. Ao editar, deixe em branco para manter a imagem atual.</p>
                            </div>
                            <div class="flex space-x-4">
                                <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 disabled:opacity-50">Adicionar</button>
                                <button type="button" id="clear-btn" class="w-full bg-gray-500 text-white font-bold py-3 rounded-lg hover:bg-gray-600">Limpar</button>
                            </div>
                        </form>
                    </div>
                    <div class="lg:col-span-2">
                        <h2 class="text-2xl font-bold mb-4 text-purple-300">Produtos na Loja</h2>
                        <div id="products-list" class="space-y-4"></div>
                    </div>
                </div>
            </div>

            <div id="bruxos-content" class="hidden">
                <h2 class="text-2xl font-bold mb-4 text-purple-300">Gerir Bruxos</h2>
                <form id="bruxos-form" class="bg-gray-800/50 p-6 rounded-lg space-y-4">
                    <div>
                        <label for="bruxos-html" class="block mb-1">Conteúdo da Página (HTML)</label>
                        <textarea id="bruxos-html" rows="10" required class="w-full bg-gray-700 p-2 rounded text-white">
                            <!-- Conteúdo atual da página bruxos.html -->
                        </textarea>
                    </div>
                    <button type="submit" id="bruxos-submit-btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 disabled:opacity-50">Guardar Alterações</button>
                </form>
            </div>
        </main>
    </div>

    <!-- Toast de feedback visual -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden min-w-[200px] max-w-xs px-4 py-3 rounded shadow-lg text-white bg-green-600 transition-opacity duration-300"></div>

    <script src="auth-config.js"></script>
    <script>
        function showToast(message, type = 'success') {
          const toast = document.getElementById('toast');
          toast.textContent = message;
          toast.className = 'fixed bottom-4 right-4 z-50 min-w-[200px] max-w-xs px-4 py-3 rounded shadow-lg text-white transition-opacity duration-300';
          if (type === 'success') toast.classList.add('bg-green-600');
          if (type === 'error') toast.classList.add('bg-red-600');
          if (type === 'info') toast.classList.add('bg-blue-600');
          toast.classList.remove('hidden');
          toast.style.opacity = 1;
          setTimeout(() => {
            toast.style.opacity = 0;
            setTimeout(() => toast.classList.add('hidden'), 300);
          }, 3000);
        }

        // Exemplo de integração do toast no admin
        function adminSuccess(msg) {
            showToast(msg || 'Ação realizada com sucesso!', 'success');
        }
        function adminError(msg) {
            showToast(msg || 'Erro ao realizar ação administrativa.', 'error');
        }

        window.addEventListener('load', async () => {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            let editingProductId = null;

            const loader = document.getElementById('loader');
            const adminPanel = document.getElementById('admin-panel');
            const logoutButton = document.getElementById('logout-button');
            const productForm = document.getElementById('product-form');
            const formTitle = document.getElementById('form-title');
            const submitBtn = document.getElementById('submit-btn');
            const productsList = document.getElementById('products-list');
            const clearBtn = document.getElementById('clear-btn');
            const imageUploadInput = document.getElementById('image-upload');
            const currentImageUrlInput = document.getElementById('current-image-url');

            async function checkAdminStatus() {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) { window.location.href = 'login.html'; return; }
                const { data: profile, error } = await supabaseClient.from('profiles').select('role').eq('id', user.id).single();
                if (error || profile.role !== 'admin') {
                    alert("Acesso negado.");
                    window.location.href = 'index.html';
                    return;
                }
                loader.style.display = 'none';
                adminPanel.classList.remove('hidden');
            }

            async function loadProducts() {
                productsList.innerHTML = '<p>A carregar produtos...</p>';
                const { data, error } = await supabaseClient.from('products').select('*').order('name', { ascending: true });
                if (error) { productsList.innerHTML = `<p class="text-red-400">Erro ao carregar produtos.</p>`; return; }
                productsList.innerHTML = '';
                data.forEach(p => {
                    const card = `<div class="bg-gray-800/50 p-4 rounded-lg flex items-center justify-between"><div class="flex items-center space-x-4"><img src="${p.image_url}" class="w-16 h-16 object-cover rounded-md"><div><p class="font-bold">${p.name}</p><p class="text-sm text-gray-400">R$ ${p.price.toFixed(2)}</p></div></div><div class="space-x-2"><button data-id="${p.id}" class="edit-btn bg-yellow-500 text-gray-900 font-bold py-1 px-3 rounded-md">Editar</button><button data-id="${p.id}" data-name="${p.name}" class="delete-btn bg-red-600 text-white font-bold py-1 px-3 rounded-md">Apagar</button></div></div>`;
                    productsList.innerHTML += card;
                });
            }

            productForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = 'A guardar...';

                const imageFile = imageUploadInput.files[0];
                let imageUrl = currentImageUrlInput.value;

                if (imageFile) {
                    const filePath = `public/${Date.now()}-${imageFile.name}`;
                    const { error: uploadError } = await supabaseClient.storage
                        .from('product-images')
                        .upload(filePath, imageFile);

                    if (uploadError) {
                        alert('Erro no upload da imagem: ' + uploadError.message);
                        submitBtn.disabled = false;
                        submitBtn.textContent = editingProductId ? 'Guardar Alterações' : 'Adicionar';
                        return;
                    }

                    const { data: urlData } = supabaseClient.storage.from('product-images').getPublicUrl(filePath);
                    imageUrl = urlData.publicUrl;
                }
                
                if (!imageUrl && !editingProductId) {
                    alert("Por favor, selecione uma imagem para o novo produto.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Adicionar';
                    return;
                }

                const productData = { name: e.target.name.value, description: e.target.description.value, price: parseFloat(e.target.price.value), image_url: imageUrl };

                const { error } = editingProductId
                    ? await supabaseClient.from('products').update(productData).eq('id', editingProductId)
                    : await supabaseClient.from('products').insert([productData]);

                if (error) {
                    alert('Erro ao guardar o produto: ' + error.message);
                } else {
                    resetForm();
                    await loadProducts();
                    showToast('Produto guardado com sucesso!', 'success');
                }
                submitBtn.disabled = false;
            });

            function resetForm() {
                productForm.reset();
                editingProductId = null;
                formTitle.textContent = 'Adicionar Novo Produto';
                submitBtn.textContent = 'Adicionar';
                submitBtn.classList.replace('bg-yellow-500', 'bg-green-600');
                currentImageUrlInput.value = '';
            }
            
            clearBtn.addEventListener('click', resetForm);
            
            productsList.addEventListener('click', async (e) => {
                const target = e.target;
                const id = target.getAttribute('data-id');
                if (target.classList.contains('edit-btn')) {
                    const { data: p, error } = await supabaseClient.from('products').select('*').eq('id', id).single();
                    if (error) { alert('Erro ao buscar produto.'); return; }
                    
                    productForm.name.value = p.name;
                    productForm.description.value = p.description;
                    productForm.price.value = p.price;
                    currentImageUrlInput.value = p.image_url;
                    
                    editingProductId = p.id;
                    formTitle.textContent = 'A Editar Produto';
                    submitBtn.textContent = 'Guardar Alterações';
                    submitBtn.classList.replace('bg-green-600', 'bg-yellow-500');
                    window.scrollTo(0, 0);
                }
                if (target.classList.contains('delete-btn')) {
                    if (confirm(`Apagar o produto "${target.getAttribute('data-name')}"?`)) {
                        const { error } = await supabaseClient.from('products').delete().eq('id', id);
                        if(error) { alert("Erro ao apagar: " + error.message); } else { await loadProducts(); showToast('Produto apagado com sucesso!', 'success'); }
                    }
                }
            });

            function showLoader(show = true, msg = 'Processando...') {
                const loader = document.getElementById('loader');
                if (show) {
                    loader.classList.remove('opacity-0');
                    loader.classList.add('opacity-100');
                    loader.querySelector('p').textContent = msg;
                    loader.style.display = 'flex';
                } else {
                    loader.classList.add('opacity-0');
                    setTimeout(() => loader.style.display = 'none', 500);
                }
            }

            await checkAdminStatus();
            await loadProducts();
            logoutButton.addEventListener('click', async () => { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; });
        });
    </script>
</body>
</html>
