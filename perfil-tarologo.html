<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Tarólogo - Clã Michetti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="text-gray-200 bg-cover bg-center" style="background-image: linear-gradient(rgba(17, 24, 39, 0.9), rgba(17, 24, 39, 1)), url('imagens/Templo 1.jpg');">

    <header class="bg-gray-900/80 backdrop-blur-sm sticky top-0 z-50 border-b border-purple-900/50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold font-cinzel text-purple-300">Clã Michetti</a>
            <div class="hidden md:flex items-center space-x-6">
                <a href="loja.html" class="hover:text-purple-300 transition-colors">Loja</a>
                <a href="tarologos.html" class="hover:text-purple-300 transition-colors">Tarólogos</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="dashboard.html" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Meu Painel</a>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container mx-auto p-8">
        <div id="loader" class="flex flex-col items-center justify-center text-center min-h-[120px] transition-opacity duration-500">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="mt-4 text-purple-200">A carregar o perfil...</p>
        </div>

        <div id="profile-container" class="hidden">
            <div class="md:grid md:grid-cols-3 md:gap-8">
                <!-- Coluna da Esquerda: Foto e Botão -->
                <div class="md:col-span-1 text-center">
                    <img id="profile-avatar" src="" alt="[Foto do Tarólogo]" class="w-48 h-48 rounded-full mx-auto mb-6 border-4 border-purple-800 object-cover">
                    <button id="start-chat-btn" class="w-full text-white font-bold py-3 px-6 rounded-lg transition-colors" disabled>
                        A verificar estado...
                    </button>
                </div>

                <!-- Coluna da Direita: Detalhes -->
                <div class="md:col-span-2 mt-8 md:mt-0">
                    <h1 id="profile-name" class="text-4xl font-cinzel text-purple-300"></h1>
                    <div id="profile-specialties" class="mt-4 flex flex-wrap gap-2"></div>
                    <p id="profile-bio" class="mt-6 text-lg text-gray-300 whitespace-pre-wrap"></p>
                </div>
            </div>
             <!-- Futura Secção de Avaliações -->
            <div class="mt-20">
                <h2 class="text-3xl font-cinzel text-center text-purple-300 mb-12">Avaliações de Clientes</h2>
                <div class="text-center text-gray-400">(Funcionalidade de avaliações para tarólogos em breve)</div>
            </div>
        </div>

        <!-- Toast de feedback visual -->
        <div id="toast" class="fixed bottom-4 right-4 z-50 hidden min-w-[200px] max-w-xs px-4 py-3 rounded shadow-lg text-white bg-green-600 transition-opacity duration-300"></div>
    </main>

    <script src="auth-config.js"></script>
    <script>
        function showToast(message, type = 'success') {
          const toast = document.getElementById('toast');
          toast.textContent = message;
          toast.className = 'fixed bottom-4 right-4 z-50 min-w-[200px] max-w-xs px-4 py-3 rounded shadow-lg text-white transition-opacity duration-300';
          if (type === 'success') toast.classList.add('bg-green-600');
          if (type === 'error') toast.classList.add('bg-red-600');
          if (type === 'info') toast.classList.add('bg-blue-600');
          toast.classList.remove('hidden');
          toast.style.opacity = 1;
          setTimeout(() => {
            toast.style.opacity = 0;
            setTimeout(() => toast.classList.add('hidden'), 300);
          }, 3000);
        }

        function showLoader(show = true, msg = 'A carregar o perfil...') {
            const loader = document.getElementById('loader');
            if (show) {
                loader.classList.remove('opacity-0');
                loader.classList.add('opacity-100');
                loader.querySelector('p').textContent = msg;
                loader.style.display = 'flex';
            } else {
                loader.classList.add('opacity-0');
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        window.addEventListener('load', async () => {
            showLoader(true, 'A carregar o perfil...');
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            let currentUser = null;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
            }
            const urlParams = new URLSearchParams(window.location.search);
            const readerId = urlParams.get('id');
            const loader = document.getElementById('loader');
            const container = document.getElementById('profile-container');
            const startChatBtn = document.getElementById('start-chat-btn');
            if (!readerId) {
                loader.innerHTML = '<p class="text-red-400 text-center">Tarólogo não especificado.</p>';
                return;
            }
            async function loadProfile() {
                const { data: reader, error } = await supabaseClient.from('profiles').select('*').eq('id', readerId).single();
                loader.style.display = 'none';
                if (error || !reader) {
                    container.innerHTML = '<p class="text-red-400 text-center">Não foi possível carregar o perfil deste tarólogo.</p>';
                    container.classList.remove('hidden');
                    return;
                }
                document.getElementById('profile-avatar').src = reader.avatar_url || `https://placehold.co/200x200/7b2cbf/FFFFFF?text=${reader.full_name.charAt(0)}`;
                document.getElementById('profile-name').textContent = reader.full_name;
                document.getElementById('profile-bio').textContent = reader.bio || 'Este tarólogo ainda não adicionou uma biografia.';
                const specialtiesContainer = document.getElementById('profile-specialties');
                if (reader.specialties && reader.specialties.length > 0) {
                    specialtiesContainer.innerHTML = '';
                    reader.specialties.forEach(s => {
                        specialtiesContainer.innerHTML += `<span class="bg-purple-900/50 text-purple-300 text-sm font-medium mr-2 px-3 py-1 rounded-full">${s}</span>`;
                    });
                } else {
                    specialtiesContainer.innerHTML = `<span class="text-sm text-gray-500">Nenhuma especialidade listada.</span>`;
                }
                // Lógica do botão de chat
                const isOnline = reader.online_status === 'online';
                if (!currentUser) {
                    startChatBtn.disabled = true;
                    startChatBtn.textContent = 'Faça login para consultar';
                    startChatBtn.classList.add('bg-gray-600', 'cursor-not-allowed');
                    startChatBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                } else if (isOnline) {
                    startChatBtn.disabled = false;
                    startChatBtn.textContent = 'Iniciar Consulta';
                    startChatBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                    startChatBtn.classList.remove('bg-gray-600', 'cursor-not-allowed');
                } else {
                    startChatBtn.disabled = true;
                    startChatBtn.textContent = 'Offline';
                    startChatBtn.classList.add('bg-gray-600', 'cursor-not-allowed');
                    startChatBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                }
                container.classList.remove('hidden');
            }
            startChatBtn.addEventListener('click', async (e) => {
                if (!currentUser) {
                    window.location.href = 'login.html';
                    return;
                }
                e.target.disabled = true;
                e.target.textContent = "A verificar...";
                const { data: profile, error: profileError } = await supabaseClient.from('profiles').select('chat_credits_minutes').eq('id', currentUser.id).single();
                if (profileError || !profile || profile.chat_credits_minutes < 1) {
                    alert("Você não tem créditos de chat suficientes.");
                    window.location.href = 'creditos.html';
                    return;
                }
                const { data: conversation, error: convError } = await supabaseClient.from('conversations').insert({ client_id: currentUser.id, tarot_reader_id: readerId, status: 'active' }).select().single();
                if (convError) {
                    alert("Erro ao iniciar a conversa.");
                    e.target.disabled = false;
                    e.target.textContent = "Iniciar Consulta";
                    return;
                }
                window.location.href = `chat.html?id=${conversation.id}`;
            });
            // Exemplo de integração do toast no perfil do tarólogo
            function perfilSalvo() {
                showToast('Perfil atualizado com sucesso!', 'success');
            }
            function statusAlterado(online) {
                showToast(online ? 'Você está online!' : 'Você está offline.', 'info');
            }
            function perfilError(msg) {
                showToast(msg || 'Erro ao atualizar perfil.', 'error');
            }

            await loadProfile();
            showLoader(false);
        });
    </script>
</body>
</html>
