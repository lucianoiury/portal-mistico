<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja - Clã Michetti</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; }
        h1, h2, h3, .font-cinzel { font-family: 'Cinzel', serif; }
        .glow-on-hover:hover {
            box-shadow: 0 0 15px 5px rgba(192, 132, 252, 0.4); /* purple-400 glow */
        }
    </style>
</head>
<body class="text-gray-200 bg-cover bg-center" style="background-image: linear-gradient(rgba(17, 24, 39, 0.9), rgba(17, 24, 39, 1)), url('imagens/Templo1.jpg');">

    <header class="bg-gray-900/80 backdrop-blur-sm sticky top-0 z-50 border-b border-purple-900/50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" id="header-logo-link" class="text-2xl font-bold font-cinzel text-purple-300">Clã Michetti</a>
            <div class="hidden md:flex items-center space-x-6">
                <a href="loja.html" class="hover:text-purple-300 transition-colors">Loja</a>
                <a href="tarologos.html" class="hover:text-purple-300 transition-colors">Tarólogos</a>
            </div>
            <div id="auth-buttons-container" class="flex items-center space-x-4">
                <div id="visitor-buttons" class="hidden">
                    <a href="login.html" class="hidden sm:inline-block bg-transparent border border-purple-400 text-purple-300 px-4 py-2 rounded-lg hover:bg-purple-400 hover:text-gray-900">Login</a>
                    <a href="cadastro.html" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Cadastre-se</a>
                </div>
                <div id="user-button" class="hidden">
                    <a href="dashboard.html" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Meu Painel</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mx-auto p-8">
        <h1 class="text-4xl font-cinzel text-center text-purple-300 mb-12">Nossos Tesouros Místicos</h1>
        <div id="loader" class="flex flex-col items-center justify-center text-center min-h-[120px] transition-opacity duration-500">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="mt-4 text-purple-200">A buscar os produtos...</p>
        </div>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 opacity-0 transition-opacity duration-500">
        </div>
    </main>

    <!-- Toast de feedback visual -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden min-w-[200px] max-w-xs px-4 py-3 rounded shadow-lg text-white bg-green-600 transition-opacity duration-300"></div>

    <script src="auth-config.js"></script>
    <script>
        function showLoader(show = true, msg = 'A buscar os produtos...') {
            const loader = document.getElementById('loader');
            if (show) {
                loader.classList.remove('opacity-0');
                loader.classList.add('opacity-100');
                loader.querySelector('p').textContent = msg;
                loader.style.display = 'flex';
            } else {
                loader.classList.add('opacity-0');
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        window.addEventListener('load', async () => {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await supabaseClient.auth.getSession();
            const visitorButtons = document.getElementById('visitor-buttons');
            const userButton = document.getElementById('user-button');
            const logoLink = document.getElementById('header-logo-link');

            if (session) {
                userButton.classList.remove('hidden');
                logoLink.href = 'dashboard.html';
            } else {
                visitorButtons.classList.remove('hidden');
                logoLink.href = 'index.html';
            }

            const productGrid = document.getElementById('product-grid');
            const loader = document.getElementById('loader');
            const { data: products, error } = await supabaseClient.from('products').select('*').order('name', { ascending: true });
            
            loader.style.display = 'none';
            if (error) { productGrid.innerHTML = `<p class="col-span-full text-center text-red-400">Não foi possível carregar os produtos.</p>`; } 
            else if (products.length === 0) { productGrid.innerHTML = `<p class="col-span-full text-center">Nenhum produto encontrado.</p>`; } 
            else {
                products.forEach(product => {
                    const price = typeof product.price === 'number' ? product.price : 0;
                    const card = `<a href="produto.html?id=${product.id}" class="glow-on-hover bg-gray-800/50 rounded-lg overflow-hidden border border-purple-900/30 flex flex-col transition transform hover:-translate-y-2"><img src="${product.image_url || 'https://placehold.co/400x300/111827/FFFFFF?text=Sem+Imagem'}" alt="${product.name}" class="w-full h-56 object-cover"><div class="p-6 flex flex-col flex-grow"><h3 class="text-xl font-bold text-purple-200 font-cinzel">${product.name}</h3><p class="mt-2 text-gray-400 flex-grow">${product.description}</p><div class="mt-4 text-right"><span class="text-2xl font-bold text-white">R$ ${price.toFixed(2).replace('.', ',')}</span></div></div></a>`;
                    productGrid.innerHTML += card;
                });
            }
            productGrid.style.opacity = '1';
        });

        function showToast(message, type = 'success') {
          const toast = document.getElementById('toast');
          toast.textContent = message;
          toast.className = 'fixed bottom-4 right-4 z-50 min-w-[200px] max-w-xs px-4 py-3 rounded shadow-lg text-white transition-opacity duration-300';
          if (type === 'success') toast.classList.add('bg-green-600');
          if (type === 'error') toast.classList.add('bg-red-600');
          if (type === 'info') toast.classList.add('bg-blue-600');
          toast.classList.remove('hidden');
          toast.style.opacity = 1;
          setTimeout(() => {
            toast.style.opacity = 0;
            setTimeout(() => toast.classList.add('hidden'), 300);
          }, 3000);
        }
        // Exemplo de uso: showToast('Bem-vindo à loja!', 'info');
    </script>
</body>
</html>
