<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Portal Místico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        #content.loaded { opacity: 1; }
    </style>
</head>
<body class="text-gray-200">

    <div id="loader" class="fixed inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center z-50 text-center p-4">
        <div>
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-purple-500 mx-auto"></div>
            <p id="loader-message" class="mt-4 text-purple-200">A carregar o seu painel...</p>
        </div>
    </div>

    <header id="main-header" class="bg-gray-900/80 backdrop-blur-sm sticky top-0 z-50 border-b border-purple-900/50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="dashboard.html" class="text-2xl font-bold font-cinzel text-purple-300">Portal Místico</a>
            <div class="hidden md:flex items-center space-x-6">
                <a href="loja.html" class="hover:text-purple-300 transition-colors">Loja</a>
                <a href="tarologos.html" class="hover:text-purple-300 transition-colors">Tarólogos</a>
            </div>
            <div class="flex items-center space-x-4">
                <button id="logout-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Sair</button>
            </div>
        </nav>
    </header>

    <div id="content" class="container mx-auto p-8 opacity-0 transition-opacity duration-500">
        <!-- O conteúdo dinâmico do painel será inserido aqui pelo JavaScript -->
    </div>

    <script src="auth-config.js"></script>
    <script>
        window.addEventListener('load', async () => {
            const contentEl = document.getElementById('content');
            const loaderEl = document.getElementById('loader');
            const headerEl = document.getElementById('main-header');

            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) { window.location.href = 'login.html'; return; }
            
            const user = session.user;
            const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();

            if (error || !profile) {
                loaderEl.innerHTML = '<p class="text-red-400 text-lg">Erro ao carregar o seu perfil. Por favor, tente fazer login novamente.</p>';
                return;
            }
            
            headerEl.classList.remove('hidden');

            if (profile.role === 'tarologo') {
                renderTarotReaderDashboard(profile, user, supabaseClient);
                await loadTarotReaderConversations(user, supabaseClient);
            } else if (profile.role === 'admin') {
                window.location.href = 'admin.html';
                return;
            } else {
                renderClientDashboard(profile);
                await loadClientOrders(user, supabaseClient);
                await loadClientConversations(user, supabaseClient);
            }

            loaderEl.style.display = 'none';
            contentEl.classList.add('loaded');
            
            document.getElementById('logout-button').addEventListener('click', async () => { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; });
        });

        function renderClientDashboard(profile) {
            document.getElementById('content').innerHTML = `
                <div id="client-dashboard">
                    <div class="bg-gray-800/50 border border-purple-900/50 rounded-2xl shadow-2xl p-8">
                        <h2 class="text-3xl font-cinzel mb-6">Painel do Cliente</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div><p class="text-sm text-gray-400">Nome</p><p class="text-lg font-bold text-purple-300">${profile.full_name}</p></div>
                            <div><p class="text-sm text-gray-400">Sua Função</p><p class="text-lg capitalize">${profile.role}</p></div>
                            <div><p class="text-sm text-gray-400">Créditos de Chat</p><p class="text-lg">${profile.chat_credits_minutes || 0} minutos</p></div>
                        </div>
                    </div>
                    <div class="mt-12 bg-gray-800/30 p-8 rounded-lg"><h3 class="text-2xl font-cinzel text-center mb-6">Ações Rápidas</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><a href="tarologos.html" class="block text-center bg-purple-600 text-white font-bold py-4 px-6 rounded-lg hover:bg-purple-700">Consultar Tarólogos</a><a href="creditos.html" class="block text-center bg-yellow-500 text-gray-900 font-bold py-4 px-6 rounded-lg hover:bg-yellow-400">Comprar Créditos</a></div></div>
                    <div class="mt-12"><h3 class="text-2xl font-cinzel mb-6">Meus Pedidos da Loja</h3><div id="orders-list" class="space-y-4"></div></div>
                    <div class="mt-12"><h3 class="text-2xl font-cinzel mb-6">Minhas Consultas</h3><div id="client-conversations-list" class="space-y-4"></div></div>
                </div>`;
        }
        
        function renderTarotReaderDashboard(profile, user, client) {
            document.getElementById('content').innerHTML = `
                <div id="tarot-reader-dashboard" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1">
                        <form id="profile-edit-form" class="bg-gray-800/50 p-6 rounded-lg space-y-4">
                            <h2 class="text-2xl font-bold mb-4 text-purple-300">Editar Meu Perfil Público</h2>
                            <div><label for="avatar_url" class="block mb-1 text-sm">URL da sua Foto de Perfil</label><input type="url" id="avatar_url" value="${profile.avatar_url || ''}" class="w-full bg-gray-700 p-2 rounded text-white"></div>
                            <div><label for="bio" class="block mb-1 text-sm">Sua Biografia</label><textarea id="bio" rows="5" class="w-full bg-gray-700 p-2 rounded text-white">${profile.bio || ''}</textarea></div>
                            <div><label for="specialties" class="block mb-1 text-sm">Especialidades (separadas por vírgula)</label><input type="text" id="specialties" value="${(profile.specialties || []).join(', ')}" class="w-full bg-gray-700 p-2 rounded text-white"></div>
                            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">Guardar Alterações</button>
                            <p id="edit-feedback" class="text-sm text-center h-4"></p>
                        </form>
                    </div>
                    <div class="lg:col-span-2">
                        <div class="bg-gray-800/50 border border-purple-900/50 rounded-2xl shadow-2xl p-8">
                             <h2 class="text-3xl font-cinzel mb-6">Painel do Tarólogo</h2>
                             <p>Bem-vindo(a), <span class="font-bold text-purple-300">${profile.full_name}</span>. Aqui estão as suas consultas.</p>
                        </div>
                        <div class="mt-12"><h3 class="text-2xl font-cinzel mb-6">Minhas Consultas</h3><div id="reader-conversations-list" class="space-y-4"></div></div>
                    </div>
                </div>`;
            
            // Adicionar o listener para o formulário de edição
            document.getElementById('profile-edit-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const feedbackEl = document.getElementById('edit-feedback');
                const submitBtn = e.target.querySelector('button');
                submitBtn.disabled = true;
                submitBtn.textContent = 'A guardar...';

                const specialtiesArray = e.target.specialties.value.split(',').map(s => s.trim()).filter(s => s);
                
                const updatedProfile = {
                    avatar_url: e.target.avatar_url.value,
                    bio: e.target.bio.value,
                    specialties: specialtiesArray,
                };
                
                const { error } = await client.from('profiles').update(updatedProfile).eq('id', user.id);

                if (error) {
                    feedbackEl.textContent = "Erro ao guardar: " + error.message;
                    feedbackEl.classList.add('text-red-400');
                } else {
                    feedbackEl.textContent = "Perfil atualizado com sucesso!";
                    feedbackEl.classList.add('text-green-400');
                }
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar Alterações';
                setTimeout(() => { feedbackEl.textContent = ''; feedbackEl.classList.remove('text-red-400', 'text-green-400'); }, 4000);
            });
        }

        async function loadClientOrders(user, client) {
            const listContainer = document.getElementById('orders-list');
            listContainer.innerHTML = '<p class="text-gray-400">A carregar...</p>';
            const { data, error } = await client.from('orders').select(`id, created_at, total_amount, status`).eq('user_id', user.id).order('created_at', { ascending: false });
            if (error) { listContainer.innerHTML = `<p class="text-red-400">Não foi possível carregar os pedidos.</p>`; return; }
            if (data.length === 0) { listContainer.innerHTML = `<div class="bg-gray-800/50 p-6 rounded-lg text-center text-gray-400">Você ainda não fez nenhum pedido.</div>`; return; }
            listContainer.innerHTML = '';
            data.forEach(order => {
                const card = `<a href="pedido.html?id=${order.id}" class="block bg-gray-800/50 p-4 rounded-lg flex justify-between items-center hover:bg-gray-700/50"><p class="font-bold">Pedido #${order.id.substring(0, 8)}</p><div><p class="font-bold text-lg text-purple-300">R$ ${order.total_amount.toFixed(2)}</p><p class="text-sm text-right capitalize">${order.status}</p></div></a>`;
                listContainer.innerHTML += card;
            });
        }

        async function loadClientConversations(user, client) {
            const listContainer = document.getElementById('client-conversations-list');
            listContainer.innerHTML = '<p class="text-gray-400">A carregar...</p>';
            const { data, error } = await client.from('conversations').select(`id, status, created_at, tarot_reader:tarot_reader_id (full_name)`).eq('client_id', user.id).order('created_at', { ascending: false });
            if (error) { listContainer.innerHTML = `<p class="text-red-400">Não foi possível carregar as consultas.</p>`; return; }
            if (data.length === 0) { listContainer.innerHTML = `<div class="bg-gray-800/50 p-6 rounded-lg text-center text-gray-400">Você ainda não realizou nenhuma consulta.</div>`; return; }
            listContainer.innerHTML = '';
            data.forEach(convo => {
                 const card = `<a href="chat.html?id=${convo.id}" class="block bg-gray-800/50 p-4 rounded-lg flex justify-between items-center hover:bg-gray-700/50"><div><p class="font-bold">Consulta com <span class="text-purple-300">${convo.tarot_reader.full_name}</span></p><p class="text-sm text-gray-400">${new Date(convo.created_at).toLocaleDateString()}</p></div><p class="font-bold capitalize">${convo.status}</p></a>`;
                listContainer.innerHTML += card;
            });
        }
        
        async function loadTarotReaderConversations(user, client) {
            const listContainer = document.getElementById('reader-conversations-list');
            listContainer.innerHTML = '<p class="text-gray-400">A carregar...</p>';
            const { data, error } = await client.from('conversations').select(`id, status, created_at, client:client_id (full_name)`).eq('tarot_reader_id', user.id).order('created_at', { ascending: false });
            if (error) { listContainer.innerHTML = `<p class="text-red-400">Não foi possível carregar as consultas.</p>`; return; }
            if (data.length === 0) { listContainer.innerHTML = `<div class="bg-gray-800/50 p-6 rounded-lg text-center text-gray-400">Você ainda não tem nenhuma consulta.</div>`; return; }
            listContainer.innerHTML = '';
            data.forEach(convo => {
                const statusClasses = {'active': 'text-green-400','pending': 'text-yellow-400','finished': 'text-gray-500'};
                const card = `<a href="chat.html?id=${convo.id}" class="block bg-gray-800/50 p-6 rounded-lg border border-purple-900/30 hover:border-purple-500"><div class="flex justify-between items-center"><div><p class="text-xl font-bold">Consulta com <span class="text-purple-300">${convo.client.full_name || 'Cliente'}</span></p></div><div class="text-right"><p class="font-bold capitalize ${statusClasses[convo.status] || ''}">${convo.status}</p><span class="text-sm text-gray-500">Entrar →</span></div></div></a>`;
                listContainer.innerHTML += card;
            });
        }
    </script>
</body>
</html>
