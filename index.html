<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clã Michetti - Loja e Consultas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0F172A; /* slate-900 */
        }
        .font-exo { 
            font-family: 'Exo 2', sans-serif; 
        }
        .card-glow {
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .card-glow:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px 5px rgba(14, 165, 233, 0.4); /* sky-500 glow */
        }
        .hero-bg {
             background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 1)), url('https://placehold.co/1920x1080/000000/FFFFFF?text=Energia+Cósmica');
        }
    </style>
</head>
<body class="text-gray-200">

    <header class="bg-slate-900/80 backdrop-blur-sm sticky top-0 z-50 border-b border-cyan-500/20">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-black font-exo tracking-wider uppercase bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-cyan-300">
                Clã Michetti
            </a>
            <div class="hidden md:flex items-center space-x-6 text-lg">
                <a href="loja.html" class="hover:text-cyan-400 transition-colors">Loja</a>
                <a href="tarologos.html" class="hover:text-cyan-400 transition-colors">Tarólogos</a>
            </div>
            <div id="auth-buttons" class="flex items-center space-x-4">
                 <a href="login.html" class="hidden sm:block border-2 border-cyan-400 text-cyan-400 px-5 py-2 rounded-lg font-bold hover:bg-cyan-400 hover:text-slate-900 transition-all duration-300">
                    Login
                </a>
                <a href="cadastro.html" class="bg-gradient-to-r from-sky-500 to-cyan-500 text-white px-5 py-2.5 rounded-lg font-bold hover:from-sky-600 hover:to-cyan-600 transition-all duration-300">
                    Cadastre-se
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="min-h-[70vh] flex items-center justify-center text-center hero-bg bg-cover bg-center">
            <div class="container mx-auto px-6">
                <h1 class="text-5xl md:text-7xl font-black font-exo uppercase text-white mb-4">Sua Conexão com o Místico</h1>
                <p class="text-lg md:text-xl text-sky-200 max-w-3xl mx-auto">Explore artefatos, agende leituras e desperte sua intuição em nossa plataforma tecnológica de magia.</p>
            </div>
        </section>

        <section id="loja-destaques" class="py-24 bg-slate-900">
            <div class="container mx-auto px-6">
                <h2 class="text-4xl font-bold font-exo text-center mb-16 text-white uppercase">Nossos Tesouros</h2>
                 <div id="loader" class="text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400 mx-auto"></div>
                    <p class="mt-4">A buscar os artefatos...</p>
                </div>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 opacity-0 transition-opacity duration-500">
                    <!-- Produtos reais serão carregados aqui -->
                </div>
            </div>
        </section>
        
    </main>

    <footer class="bg-slate-900 border-t border-cyan-500/20">
        <div class="container mx-auto px-6 py-8 text-center text-gray-400">
            <p>&copy; 2025 Clã Michetti. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="auth-config.js"></script>
    <script>
        window.addEventListener('load', async () => {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtonsContainer = document.getElementById('auth-buttons');
            if (session) {
                authButtonsContainer.innerHTML = `<a href="dashboard.html" class="bg-gradient-to-r from-sky-500 to-cyan-500 text-white px-5 py-2.5 rounded-lg font-bold">Meu Painel</a>`;
            }

            // Lógica para carregar os produtos em destaque
            const productGrid = document.getElementById('product-grid');
            const loader = document.getElementById('loader');
            
            // Busca apenas os 4 produtos mais recentes
            const { data: products, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(4);

            loader.style.display = 'none';

            if (error) {
                productGrid.innerHTML = `<p class="text-center col-span-full text-red-400">Não foi possível carregar os produtos.</p>`;
                productGrid.style.opacity = '1';
                return;
            }

            if (products && products.length > 0) {
                products.forEach(product => {
                    const price = typeof product.price === 'number' ? product.price : 0;
                    const productCard = `
                        <a href="produto.html?id=${product.id}" class="card-glow bg-slate-800/50 rounded-lg overflow-hidden border border-cyan-500/20 flex flex-col">
                            <img src="${product.image_url || 'https://placehold.co/400x300/0F172A/FFFFFF?text=Sem+Imagem'}" alt="[Imagem de ${product.name}]" class="w-full h-56 object-cover">
                            <div class="p-6 flex flex-col flex-grow">
                                <h3 class="text-xl font-bold text-cyan-300 font-exo">${product.name || 'Produto Sem Nome'}</h3>
                                <p class="mt-2 text-gray-400 flex-grow">${product.description || 'Sem descrição.'}</p>
                                <div class="mt-4 text-right">
                                    <span class="text-2xl font-bold text-white">R$ ${price.toFixed(2).replace('.', ',')}</span>
                                </div>
                            </div>
                        </a>`;
                    productGrid.innerHTML += productCard;
                });
            } else {
                 productGrid.innerHTML = `<p class="text-center col-span-full">Nenhum produto em destaque no momento.</p>`;
            }
            productGrid.style.opacity = '1';
        });
    </script>
</body>
</html>
