<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clã Michetti - Loja e Consultas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
        }
        h1, h2, h3, .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .glow-on-hover:hover {
            box-shadow: 0 0 15px 5px rgba(192, 132, 252, 0.4); /* purple-400 glow */
        }
    </style>
</head>
<body class="text-gray-200">

    <header class="bg-gray-900/80 backdrop-blur-sm sticky top-0 z-50 border-b border-purple-900/50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold font-cinzel text-purple-300">
                Clã Michetti
            </a>
            <div class="hidden md:flex items-center space-x-6">
                <a href="loja.html" class="hover:text-purple-300 transition-colors">Loja</a>
                <a href="tarologos.html" class="hover:text-purple-300 transition-colors">Tarólogos</a>
            </div>
            <div id="auth-buttons" class="flex items-center space-x-4">
                 <a href="login.html" class="hidden sm:block bg-transparent border border-purple-400 text-purple-300 px-4 py-2 rounded-lg hover:bg-purple-400 hover:text-gray-900">Login</a>
                <a href="cadastro.html" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Cadastre-se</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="min-h-[70vh] flex items-center justify-center text-center bg-gray-900 bg-cover bg-center" style="background-image: linear-gradient(rgba(17, 24, 39, 0.8), rgba(17, 24, 39, 1)), url('https://placehold.co/1920x1080/000000/FFFFFF?text=Universo+Mistico');">
            <div class="container mx-auto px-6">
                <h1 class="text-5xl md:text-7xl font-bold font-cinzel text-white mb-4">Sua Conexão com o Místico</h1>
                <p class="text-lg md:text-xl text-purple-200 max-w-3xl mx-auto">Explore artefatos, agende leituras e desperte sua intuição.</p>
            </div>
        </section>

        <section id="loja-destaques" class="py-24 bg-gray-900">
            <div class="container mx-auto px-6">
                <h2 class="text-4xl font-bold font-cinzel text-center mb-16 text-purple-300">Nossos Tesouros</h2>
                 <div id="loader" class="text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mx-auto"></div>
                    <p class="mt-4">A buscar os artefatos...</p>
                </div>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 opacity-0 transition-opacity duration-500">
                    <!-- Produtos reais serão carregados aqui -->
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 border-t border-purple-900/50">
        <div class="container mx-auto px-6 py-8 text-center text-gray-400">
            <p>&copy; 2025 Clã Michetti. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="auth-config.js"></script>
    <script>
        window.addEventListener('load', async () => {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtonsContainer = document.getElementById('auth-buttons');
            if (session) {
                authButtonsContainer.innerHTML = `<a href="dashboard.html" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Meu Painel</a>`;
            }

            const productGrid = document.getElementById('product-grid');
            const loader = document.getElementById('loader');
            
            const { data: products, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false }).limit(4);

            loader.style.display = 'none';
            if (error) {
                productGrid.innerHTML = `<p class="text-center col-span-full text-red-400">Não foi possível carregar os produtos.</p>`;
            } else if (products && products.length > 0) {
                products.forEach(product => {
                    const price = typeof product.price === 'number' ? product.price : 0;
                    const card = `<a href="produto.html?id=${product.id}" class="glow-on-hover bg-gray-800/50 rounded-lg overflow-hidden border border-purple-900/30 flex flex-col transition"><img src="${product.image_url || 'https://placehold.co/400x300/111827/FFFFFF?text=Sem+Imagem'}" alt="${product.name}" class="w-full h-56 object-cover"><div class="p-6 flex flex-col flex-grow"><h3 class="text-xl font-bold text-purple-200 font-cinzel">${product.name}</h3><p class="mt-2 text-gray-400 flex-grow">${product.description}</p><div class="mt-4 text-right"><span class="text-2xl font-bold text-white">R$ ${price.toFixed(2).replace('.', ',')}</span></div></div></a>`;
                    productGrid.innerHTML += card;
                });
            } else {
                 productGrid.innerHTML = `<p class="text-center col-span-full">Nenhum produto em destaque no momento.</p>`;
            }
            productGrid.style.opacity = '1';
        });
    </script>
</body>
</html>
