<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Tarólogos - Clã Michetti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="text-gray-200 bg-cover bg-center" style="background-image: linear-gradient(rgba(17, 24, 39, 0.9), rgba(17, 24, 39, 1)), url('imagens/Templo1.jpg');">

    <header class="bg-gray-900/80 backdrop-blur-sm sticky top-0 z-50 border-b border-purple-900/50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold font-cinzel text-purple-300">Clã Michetti</a>
            <div class="hidden md:flex items-center space-x-6">
                <a href="loja.html" class="hover:text-purple-300 transition-colors">Loja</a>
                <a href="tarologos.html" class="hover:text-purple-300 transition-colors">Tarólogos</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="dashboard.html" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Meu Painel</a>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container mx-auto p-8">
        <div class="text-center">
            <h1 class="text-4xl font-cinzel text-purple-300 mb-4">Nossos Oraculistas</h1>
            <p class="text-lg text-gray-400 mb-8">Conecte-se com especialistas e encontre as respostas que procura.</p>
        </div>

        <div id="loader" class="text-center py-10">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mx-auto"></div>
            <p class="mt-4">A encontrar os tarólogos disponíveis...</p>
        </div>

        <div id="tarot-readers-container" class="hidden mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards dos Tarólogos serão inseridos aqui -->
        </div>
    </main>

    <!-- Toast de feedback visual -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden min-w-[200px] max-w-xs px-4 py-3 rounded shadow-lg text-white bg-green-600 transition-opacity duration-300"></div>

    <script src="auth-config.js"></script>
    <script>
        function showToast(message, type = 'success') {
          const toast = document.getElementById('toast');
          toast.textContent = message;
          toast.className = 'fixed bottom-4 right-4 z-50 min-w-[200px] max-w-xs px-4 py-3 rounded shadow-lg text-white transition-opacity duration-300';
          if (type === 'success') toast.classList.add('bg-green-600');
          if (type === 'error') toast.classList.add('bg-red-600');
          if (type === 'info') toast.classList.add('bg-blue-600');
          toast.classList.remove('hidden');
          toast.style.opacity = 1;
          setTimeout(() => {
            toast.style.opacity = 0;
            setTimeout(() => toast.classList.add('hidden'), 300);
          }, 3000);
        }

        window.addEventListener('load', async () => {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            // Removido o redirecionamento obrigatório para login
            let currentUser = null;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
            }
            const loader = document.getElementById('loader');
            const container = document.getElementById('tarot-readers-container');
            async function loadTarotReaders() {
                const { data: readers, error } = await supabaseClient
                    .from('profiles')
                    .select('id, full_name, avatar_url, specialties, online_status')
                    .eq('role', 'tarologo');
                loader.style.display = 'none';
                if (error) {
                    container.innerHTML = `<p class="text-red-400 text-center col-span-full">Erro ao carregar os tarólogos.</p>`;
                    container.classList.remove('hidden');
                    showToast('Erro ao carregar os tarólogos.', 'error');
                    return;
                }
                if (readers.length === 0) {
                    container.innerHTML = `<p class="text-gray-400 text-center col-span-full">Nenhum tarólogo disponível no momento.</p>`;
                } else {
                    // Ordena a lista para mostrar os tarólogos online primeiro
                    readers.sort((a, b) => {
                        if (a.online_status === 'online' && b.online_status !== 'online') return -1;
                        if (a.online_status !== 'online' && b.online_status === 'online') return 1;
                        return 0;
                    });
                    readers.forEach(reader => {
                        if(currentUser && reader.id === currentUser.id) return;
                        const isOnline = reader.online_status === 'online';
                        const statusClass = isOnline ? 'bg-green-500' : 'bg-gray-500';
                        const statusText = isOnline ? 'Online' : 'Offline';
                        const specialtiesHtml = (reader.specialties || [])
                            .map(s => `<span class="bg-purple-900/50 text-purple-300 text-xs font-medium mr-2 px-2.5 py-0.5 rounded">${s}</span>`)
                            .join('');
                        const readerCard = `
                            <div class="bg-gray-800/50 p-6 rounded-lg border border-transparent hover:border-purple-500 transition-colors text-center flex flex-col">
                                <div class="relative mx-auto">
                                    <img src="${reader.avatar_url || `https://placehold.co/150x150/7b2cbf/FFFFFF?text=${reader.full_name.charAt(0)}`}" alt="[Foto de ${reader.full_name}]" class="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-purple-800 object-cover">
                                    <div class="absolute bottom-4 right-0 flex items-center space-x-2 bg-gray-900/80 rounded-full py-1 px-3">
                                        <span class="w-3 h-3 rounded-full ${statusClass}"></span>
                                        <span class="text-xs font-bold">${statusText}</span>
                                    </div>
                                </div>
                                <h2 class="text-2xl font-bold text-purple-300 mt-2">${reader.full_name}</h2>
                                <div class="mt-2 h-10 flex-grow">${specialtiesHtml}</div>
                                <a href="perfil-tarologo.html?id=${reader.id}" class="mt-4 block bg-gray-700 text-white font-bold py-2 px-6 rounded-lg w-full hover:bg-purple-600 transition-colors">
                                    Ver Perfil
                                </a>
                            </div>
                        `;
                        container.innerHTML += readerCard;
                    });
                }
                container.classList.remove('hidden');
            }
            loadTarotReaders();
        });

        // Exemplo de integração do toast em tarólogos
        function favoritoAdicionado() {
            showToast('Tarólogo adicionado aos favoritos!', 'success');
        }
        function tarologosError(msg) {
            showToast(msg || 'Erro ao carregar tarólogos.', 'error');
        }
        // Use showToast em todos os pontos de feedback ao usuário!
    </script>
</body>
</html>
